<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Homegames — Play</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { background: #000; height: 100vh; overflow: hidden; }
            #game-container { width: 100vw; height: 100vh; }
            #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #888; font-family: sans-serif; font-size: 1.2em; }
        </style>
    </head>
    <body>
        <div id="game-container"></div>
        <div id="status">Connecting...</div>
    </body>
    <script src="/homegames-client.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const wsUrl = params.get('ws');
        const statusEl = document.getElementById('status');

        if (!wsUrl) {
            statusEl.textContent = 'No session URL provided';
        } else {
            const client = new HomegamesClient({
                containerId: 'game-container',
                wsUrl: wsUrl,
                onReady: (playerId) => {
                    statusEl.style.display = 'none';
                },
                onClose: () => {
                    statusEl.style.display = '';
                    statusEl.textContent = 'Disconnected';
                },
                onError: (err) => {
                    statusEl.style.display = '';
                    statusEl.textContent = 'Connection error';
                },
            });
            client.start();
        }
    </script>
</html>
