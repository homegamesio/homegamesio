<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password — Homegames</title>
    <style>
        :root { --bg:#15171c; --panel:#1d2027; --line:#2c313c; --text:#e6e8ec; --muted:#8b93a3; --accent:#94d2e6; --danger:#f17070; --ok:#5ac18e; }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,sans-serif; }
        a { color:var(--accent); }
        .card { max-width:360px; margin:12vh auto; display:flex; flex-direction:column; gap:12px; padding:26px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
        h1 { font-size:1.25em; margin:0; }
        p.sub { color:var(--muted); margin:0 0 4px; font-size:0.92em; }
        input { background:#11131a; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:9px 11px; font:inherit; }
        button { background:var(--accent); border:none; color:#0c1116; font-weight:bold; border-radius:6px; padding:9px 12px; cursor:pointer; }
        button:disabled { opacity:0.6; cursor:default; }
        .msg { min-height:1.2em; font-size:0.9em; }
        .msg.err { color:var(--danger); }
        .msg.ok { color:var(--ok); }
        .links { text-align:center; font-size:0.9em; margin-top:4px; }
        .hidden { display:none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reset password</h1>

        <!-- Step 1: request a code -->
        <div id="step-request">
            <p class="sub">Enter your account email and we'll send you a reset code.</p>
            <input type="email" id="email" placeholder="Email" autocomplete="email" style="width:100%;margin-bottom:10px;">
            <button id="send-btn" style="width:100%;">Send reset code</button>
        </div>

        <!-- Step 2: enter code + new password -->
        <div id="step-reset" class="hidden">
            <p class="sub">Enter the code from your email and choose a new password (min 8 characters).</p>
            <input type="text" id="code" placeholder="Reset code" autocomplete="one-time-code" style="width:100%;margin-bottom:10px;">
            <input type="password" id="new-password" placeholder="New password" autocomplete="new-password" style="width:100%;margin-bottom:10px;">
            <button id="reset-btn" style="width:100%;">Set new password</button>
        </div>

        <div class="msg" id="msg"></div>
        <div class="links"><a href="/studio">Back to login</a></div>
    </div>

    <script src="/reset-password.js"></script>
</body>
</html>
