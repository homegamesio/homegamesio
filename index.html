<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Homegames</title>
        <link rel="stylesheet" href="app.css">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">
    </head>
    <style>
        #content h1, #content h2 {
            font-weight: lighter;
        }
    </style>
    <body>
        <div id="modal" class="fade-in" hidden>
            <div id="modal-content">
                <div class="close clickable" onclick="hideModal()">X</div>
                <div class="content"></div>
            </div>
        </div>
        <div id="main">
            <div id="page-container">
                <div id="header" class="clickable">
                    <div onclick="goHome()" class="hg-button clickable" id="logo"><img alt="home" src="https://d3lgoy70hwd3pc.cloudfront.net/homegames_logo_small.png"></img></div>
                </div>
                <div id="content" style="font-weight: lighter;">
                    <div id="info-content">
                        <div class='headlines amateur'>
                            <h1>Homegames is a free and open-source game platform.</h1>
                        </div>
                        <div id="top-buttons" class="amateur">
                            <div style="width: 100%; display: flex; justify-content: center;">
                                <a style="text-decoration: none; background: rgba(148, 210, 229, 255); font-family: 'amateur'; font-size: 1.5em; width: 160px; border-radius: 80px; height: 160px; line-height: 160px;" href="/studio.html" class="clickable hg-button content-button">Studio</a>
                            </div>
                            <div style="width: 100%; display: flex; justify-content: center;">                      
                                <a style="text-decoration: none; background: #A0EB5D; font-size: 1.5em; width: 160px; border-radius: 80px; height: 160px; line-height: 160px; margin-right: 160px;" href="/map.html" class="clickable hg-button content-button">Games</a>
                                <a style="text-decoration: none; background: rgba(241, 112, 111, 255); font-size: 1.5em; width: 160px; border-radius: 80px; height: 160px; line-height: 160px;" href="/catalog.html" class="clickable hg-button content-button">Self Hosting</a>
                            </div>
                            <div style="width: 100%; display: flex; justify-content: center;">
                                <a style="text-decoration: none; background: rgba(255, 247, 142, 255); font-size: 1.5em; width: 160px; border-radius: 80px; height: 160px; line-height: 160px;" href="https://picodeg.io" target="_blank" class="clickable hg-button content-button">Contact</a>
                            </div>
                        </div> 
                        <div id="links">
                            <div style="display: grid; grid-template-columns: 1fr; text-align: center;" class="amateur">
                                <ul>
                                    <li><a href="/resources.html">GitHub</a></li>
                                    <li><a href="/podcast.html">Youtube</a></li>
                                    <li><a href="/podcast.html">Twitter</a></li>
                                    <li><a href="/terms.html">Terms of Service</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </body>
    <script src="bundle.js"></script>

</html>
